services:
  db:
    image: postgres:18-alpine
    container_name: calendly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: calendly
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: calendly
    ports:
      - "5432:5432"
    volumes:
      - calendly-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calendly -d calendly"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  calendly-pgdata: